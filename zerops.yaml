zerops:
  - setup: fcc
    build:
      base: python@3.14
      buildCommands:
        - curl -LsSf https://astral.sh/uv/install.sh | sh
        - export PATH="$HOME/.local/bin:$PATH"
        - uv sync --python 3.14 --no-dev 2>/dev/null || uv pip install --target=./vendor --system free-claude-code
        - ls ./vendor/bin 2>/dev/null || ls ./.venv/bin 2>/dev/null | head
        - chmod +x ./start.sh
      deployFiles:
        - ./vendor
        - ./start.sh
    run:
      base: python@3.14
      ports:
        - port: 8082
          httpSupport: true
      envVariables:
        HOST: 0.0.0.0
        PORT: 8082
        FCC_OPEN_BROWSER: "false"
      start: bash ./start.sh
