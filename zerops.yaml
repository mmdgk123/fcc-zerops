zerops:
  - setup: fcc
    build:
      base: python@3.14
      buildCommands:
        - pip install --prefix=/var/www/.local free-claude-code
        - chmod +x ./start.sh
      deployFiles:
        - ./start.sh
      cache:
        - /var/www/.local
    run:
      base: python@3.14
      ports:
        - port: 8082
          httpSupport: true
      envVariables:
        HOST: 0.0.0.0
        PORT: 8082
        FCC_OPEN_BROWSER: "false"
      start: bash ./start.sh
